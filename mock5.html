<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mock-up 5 - Chat Mate</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#eef1f4;max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column;color:#222}
.tag{position:fixed;top:10px;right:10px;background:#0099db;color:#fff;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;z-index:50}
header{background:#0099db;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header .av{width:40px;height:40px;border-radius:50%;background:#fff;color:#0099db;display:flex;align-items:center;justify-content:center;font-size:22px}
header .n{font-weight:800;font-size:17px}
header .st{font-size:12px;opacity:.85}
.log{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:12px 15px;border-radius:18px;font-size:16px;line-height:1.45;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.bot{background:#fff;border-bottom-left-radius:5px;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.me{background:#79b829;color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.me.photo{background:#26323a;color:#9fd8f2;font-family:ui-monospace,monospace;font-size:14px}
.card{background:#fff;border:2px solid #dce3ea;border-radius:14px;padding:12px;align-self:flex-start;max-width:88%;font-size:14.5px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card b{font-family:ui-monospace,monospace}
.chips{padding:10px 12px 18px;background:#eef1f4;flex-shrink:0;display:flex;flex-direction:column;gap:10px}
.chips button{border:0;border-radius:16px;padding:18px;font-size:17px;font-weight:800;cursor:pointer;background:#0099db;color:#fff;width:100%}
.chips button.alt{background:#fff;color:#0099db;border:2.5px solid #0099db}
.chips .inrow{display:flex;gap:10px}
.chips input{flex:1;border:2.5px solid #0099db;border-radius:16px;padding:16px;font-size:18px}
.chips input:focus{outline:none}
.chips .send{width:auto;padding:16px 22px}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.namegrid button{padding:14px 6px;font-size:15px;background:#fff;color:#0099db;border:2.5px solid #0099db}
</style>
</head>
<body>
<div class="tag">MOCK-UP #5</div>
<header><div class="av">⚡</div><div><div class="n">Sparky</div><div class="st">your paperwork mate · online</div></div></header>
<div class="log" id="log"></div>
<div class="chips" id="chips"></div>
<script>
const log=document.getElementById('log'),chips=document.getElementById('chips');
const B=['A1','A2','A3','A4'];
const SERS=['0013301624','0013301627','0013310784','0013310808'];
const OLDS=['N2002172977','N2002172981','N2001988014','N2002171205'];
let tech='mate';
function bot(t,cls){const d=document.createElement('div');d.className=cls||'msg bot';d.innerHTML=t;log.appendChild(d);log.scrollTop=log.scrollHeight;}
function me(t,cls){const d=document.createElement('div');d.className='msg me'+(cls?' '+cls:'');d.innerHTML=t;log.appendChild(d);log.scrollTop=log.scrollHeight;}
function btn(label,fn,alt){const b=document.createElement('button');if(alt)b.className='alt';b.textContent=label;b.onclick=fn;return b;}
function chipset(...btns){chips.innerHTML='';btns.forEach(b=>chips.appendChild(b));}
function start(){
 bot("G'day. Who am I talking to?");
 const names=['Medium','Big Luke','Ian','Mitch','Baby Luke','The Biz'];
 const g=document.createElement('div');g.className='namegrid';
 names.forEach(n=>g.appendChild(btn(n,()=>{tech=n;me(n);jobQ();})));
 chips.innerHTML='';chips.appendChild(g);
}
function jobQ(){
 setTimeout(()=>{
  bot("Legend. You're 120 m from this one:");
  bot('<b>WOR201311802073</b><br>Cnr Pittwater Rd &amp; Winbourne Rd, Brookvale<br>62A · 4 Batteries','card');
  chipset(btn("That's the one",()=>{me("That's the one");newIntro();}),btn('Different job',()=>{me('Different job');bot('No dramas - in the real app I\'d list the others. Demo sticks with Brookvale.');newIntro();},true));
 },300);
}
let bi=0;
function newIntro(){bi=0;setTimeout(()=>{bot('Righto, new batteries going in. Four of them, one at a time. Easy.');ocvQ();},350);}
function ocvQ(){
 setTimeout(()=>{
  bot('<b>'+B[bi]+'</b> - what\'s the OCV reading?');
  chips.innerHTML='<div class="inrow"><input type="number" inputmode="decimal" id="ocv" placeholder="13.1"><button class="send" onclick="ocvA()">Send</button></div>';
  document.getElementById('ocv').focus();
 },350);
}
function ocvA(){const v=document.getElementById('ocv').value||'13.1';me(v+' V');snapQ();}
function snapQ(){
 setTimeout(()=>{
  bot('Now snap the sticker and the serial - one photo does the lot.');
  chipset(btn('📷 Snap it',()=>{me('📷 photo sent','photo');snapA();}),btn('⌨️ Type it instead',()=>{me('I\'ll type it');typeQ();},true));
 },350);
}
function snapA(){
 setTimeout(()=>{
  bot('Got it. Batch <b>1125</b> → Nov 2025, serial <b>'+SERS[bi]+'</b>. Photo saved as proof.','card');
  chipset(btn('✓ Spot on',()=>{me('Spot on');nextNew();}),btn('Fix something',()=>{me('Fix it');typeQ();},true));
 },400);
}
function typeQ(){
 setTimeout(()=>{
  bot('No worries - punch in the serial (the date I\'ll take as MMYY).');
  chips.innerHTML='<div class="inrow"><input type="text" inputmode="numeric" id="ser" placeholder="'+SERS[bi]+'"><button class="send" onclick="typeA()">Send</button></div>';
  document.getElementById('ser').focus();
 },350);
}
function typeA(){const v=document.getElementById('ser').value||SERS[bi];me(v);nextNew();}
function nextNew(){
 bi++;
 if(bi<4){setTimeout(()=>{bot((4-bi)+' to go. '+B[bi]+' next.');ocvQ();},350);}
 else{bi=0;setTimeout(()=>{bot('New ones done ✓ Now the old batteries coming out - barcode grabs serial AND date in one hit.');oldQ();},400);}
}
function oldQ(){
 setTimeout(()=>{
  bot('Old <b>'+B[bi]+'</b> - scan the barcode.');
  chipset(btn('📷 Scan it',()=>{me('📷 scanned','photo');oldA();}),btn('No sticker - NA',()=>{me('No sticker');nextOld();},true));
 },300);
}
function oldA(){
 setTimeout(()=>{
  bot('<b>'+OLDS[bi]+'</b> · made Feb 2020. Both boxes filled.','card');
  chipset(btn('✓ Next',()=>{me('Next');nextOld();}));
 },350);
}
function nextOld(){
 bi++;
 if(bi<4)oldQ();
 else setTimeout(()=>{bot('Last bit - String Test. Voltage then current, off the meter.');strQ();},400);
}
let strV=null;
function strQ(){
 chips.innerHTML='<div class="inrow"><input type="number" inputmode="decimal" id="sv" placeholder="String A Volts e.g. 52.0"><button class="send" onclick="strA()">Send</button></div>';
 document.getElementById('sv').focus();
}
function strA(){
 if(strV===null){strV=document.getElementById('sv').value||'52.0';me(strV+' V');
  bot('And the current?');
  chips.innerHTML='<div class="inrow"><input type="number" inputmode="decimal" id="sv" placeholder="e.g. 5.9"><button class="send" onclick="strA()">Send</button></div>';
  document.getElementById('sv').focus();}
 else{me((document.getElementById('sv').value||'5.9')+' A');wrap();}
}
function wrap(){
 setTimeout(()=>{
  bot('That\'s the lot. Here\'s what I built while you packed the van:');
  bot('📄 <b>62AH Battery WOR201311802073.xlsx</b><br>4 new in ✓ · 4 old out ✓ · string test ✓<br>Filed to nbn Drive · ready to email nbn@ with photos','card');
  chipset(btn('Send it 🚀',()=>{me('Send it');fin();}),btn('Let me check first',()=>{me('Checking...');bot('Take your time - tap any line to change it (demo skips ahead).');chipset(btn('Send it 🚀',()=>{me('Send it');fin();}));},true));
 },400);
}
function fin(){
 setTimeout(()=>{
  bot('Sent ✓ Paperwork done before you\'re out of the driveway. See ya at the next one, '+tech+' 👊');
  chipset(btn('Restart demo',()=>location.reload(),true));
 },400);
}
start();
</script>
</body>
</html>
